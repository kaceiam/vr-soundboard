<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Soundboard</title>
<style>
  :root { --bg:#14121f; --card:#221e36; --text:#f3f0ff; --muted:#a59fc4; --accent:#8b5cf6; --hot:#f43f5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, Segoe UI, sans-serif; padding:16px; }
  h1 { margin:0 0 12px; font-size:28px; }
  h2 { margin:28px 0 10px; font-size:22px; }
  .bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); padding:12px; border-radius:14px; box-shadow:0 4px 16px #0008; }
  select, button { font:inherit; border-radius:10px; border:none; padding:10px 12px; }
  select { background:#0f0d18; color:var(--text); max-width:100%; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .pad { background:var(--card); color:var(--text); font-size:16px; font-weight:700; padding:22px 8px; cursor:pointer; border:2px solid transparent; transition:transform .08s; min-height:90px; }
  .pad:hover { border-color:var(--accent); }
  .pad:active { transform:scale(.95); }
  .pad.on { background:var(--accent); }
  .stop { background:var(--hot); color:white; font-weight:700; cursor:pointer; }
  .small { background:#3a3358; color:var(--text); cursor:pointer; }
  .songs { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
  .song { background:var(--card); border-radius:14px; padding:10px; }
  .song b { display:block; margin:0 0 8px 4px; }
  iframe { width:100%; height:152px; border:0; border-radius:12px; }
  iframe.big { height:452px; }
  #vol { width:140px; }
</style>
</head>
<body>
<h1>🎧 VR Soundboard</h1>

<div class="bar">
  <span>Sound goes to:</span>
  <select id="out"><option value="">My speakers / headset</option></select>
  <button class="small" id="findOut">Find outputs</button>
  <span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.01" value="1">
  <button class="stop" id="stopAll">■ Stop all</button>
</div>

<h2>🔥 Most viral sounds right now</h2>
<div class="grid" id="sfx"></div>

<h2>🎵 Songs</h2>
<div class="songs" id="songs"></div>

<h2>📈 Spotify Viral 50 (the most viral songs in the world this week)</h2>
<div class="song"><iframe class="big" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbLiRSasKsNU9" allow="autoplay; clipboard-write; encrypted-media; fullscreen" loading="lazy"></iframe></div>

<script>
// Real sound clips, from the myinstants.com trending list (Nov 2026).
const BASE = 'https://www.myinstants.com/media/sounds/';
const SOUNDS = [
  ['FAHHHHH', 'fahhhhhhhhhhhhhh.mp3'],
  ['Vine Boom', 'vine-boom.mp3'],
  ['FAAAH', 'faaah.mp3'],
  ['Fart', 'dry-fart.mp3'],
  ['Slip Fart', 'slip-fart-cuffem.mp3'],
  ['Rizz', 'rizz-sound-effect.mp3'],
  ['Yo Phone Is Ringing', 'yo-phone-is-ringing-your-phone-was-ringing.mp3'],
  ['Anime Wow', 'anime-wow-sound-effect.mp3'],
  ['Among Us Reveal', 'among-us-role-reveal-sound.mp3'],
  ['Dexter Meme', 'dexter-meme.mp3'],
  ['Bark & Fart', 'bark-fart_XRsy1HE.mp3'],
  ['CapCut Explosion', 'capcut-explosion-sound.mp3'],
  ['Fahhh', 'fahhh_KcgAXfs.mp3'],
  ['Fart Button', 'perfect-fart.mp3'],
  ['Apple Pay', 'applepay.mp3'],
  ['Shocked', 'shocked-sound-effect.mp3'],
  ['SpongeBob Fail', 'spongebob-fail.mp3'],
  ['BRUH', 'movie_1.mp3'],
  ['Undertaker Bell', 'undertakers-bell_2UwFCIe.mp3'],
  ['Chicken Screaming', 'chicken-on-tree-screaming.mp3'],
  ['Bone Crack', 'bone-crack.mp3'],
  ['Spiderman Meme Song', 'spiderman-meme-song.mp3'],
  ['Meow~', 'm-e-o-w.mp3'],
  ['MJ Hee Hee', 'michael-jackson-hee-hee.mp3'],
  ['Wrong Buzzer', 'wrong-answer-sound-effect.mp3'],
  ['Anime Ahh', 'anime-ahh.mp3'],
  ['Romanceeee', 'romanceeeeeeeeeeeeee.mp3'],
  ['Cat Laugh', 'cat-laugh-meme-1.mp3'],
  ['Gunshot Meme', 'gunshot-meme.mp3'],
  ['Shut Up Mom', 'shut-up-mom.mp3'],
  ['Ding', 'ding-sound-effect_2.mp3'],
  ['Punch', 'punch-gaming-sound-effect-hd_RzlG1GE.mp3'],
  ['Long Brain Fart', 'long-brain-fart.mp3'],
  ['Metal Pipe', 'metal-pipe-clang.mp3'],
  ['Fortnite Death', 'tmp_7901-951678082.mp3'],
  ['HUH? Cat', 'huh-cat-meme.mp3'],
];

// Full songs, played by Spotify's own player.
const SONGS = [
  ['Cosmic Relief – Rolling Eyes', 'track/3sYdy1RNZWiniyFBoEgznK'],
  ['SugarCrash! – ElyOtto', 'track/2ePtv8MlBO9nuuXABqAfEX'],
  ['Cats – The Living Tombstone', 'album/4rFIBNrUsjzH7ZefMRj6ml'],
  ['Peli De Terror – Køddy G, THE FAVORITES', 'track/23XDZWXMOiRrm0qoKXCPbf'],
  ['Thriller – Michael Jackson', 'track/3S2R0EVwBSAVMd5UMgKTL0'],
  ['Ramalama (Bang Bang) – Róisín Murphy', 'track/1i4JlWqVDl8nG8lL6ybjuN'],
  ['oh yeah? – Steve Lacy', 'track/22NHkFYbgxB2Zirj29Gbp8'],
];

let outId = '', volume = 1, playing = [];
try { outId = localStorage.getItem('vr-out') || ''; } catch {}

const grid = document.getElementById('sfx');
SOUNDS.forEach(([name, file]) => {
  const b = document.createElement('button');
  b.className = 'pad'; b.textContent = name;
  b.onclick = async () => {
    const a = new Audio(BASE + file);
    a.volume = volume;
    b.classList.add('on');
    a.onended = a.onerror = () => { b.classList.remove('on'); playing = playing.filter(x => x !== a); };
    playing.push(a);
    // Switch to the chosen output BEFORE playing, so none of the sound leaks out of the wrong speakers.
    if (outId && a.setSinkId) { try { await a.setSinkId(outId); } catch {} }
    if (!playing.includes(a)) return;   // "Stop all" was pressed meanwhile
    a.play().catch(() => b.classList.remove('on'));
  };
  grid.appendChild(b);
});

const songsBox = document.getElementById('songs');
SONGS.forEach(([name, id]) => {
  const d = document.createElement('div'); d.className = 'song';
  d.innerHTML = `<b>${name}</b><iframe src="https://open.spotify.com/embed/${id}" allow="autoplay; clipboard-write; encrypted-media; fullscreen" loading="lazy"></iframe>`;
  songsBox.appendChild(d);
});

document.getElementById('vol').oninput = e => { volume = +e.target.value; playing.forEach(a => a.volume = volume); };
document.getElementById('stopAll').onclick = () => {
  playing.forEach(a => a.pause()); playing = [];
  document.querySelectorAll('.pad.on').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('iframe').forEach(f => f.src = f.src); // stops Spotify players
};

async function listOutputs(ask) {
  if (ask) { try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); } catch {} }
  const sel = document.getElementById('out');
  sel.innerHTML = '<option value="">My speakers / headset</option>';
  (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'audiooutput' && d.deviceId !== 'default' && d.deviceId !== 'communications')
    .forEach(d => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || 'Output'; sel.appendChild(o); });
  sel.value = [...sel.options].some(o => o.value === outId) ? outId : '';
}
document.getElementById('findOut').onclick = () => listOutputs(true);
document.getElementById('out').onchange = e => { outId = e.target.value; try { localStorage.setItem('vr-out', outId); } catch {} };
listOutputs(false);
</script>
</body>
</html>
